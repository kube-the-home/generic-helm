image:
  registry: "docker.io"
  repository: ~
  tag: ~
  pullPolicy: "IfNotPresent"

imagePullSecrets: []

application:
  replicas: 1
  revisionHistoryLimit: 1
  annotations: {}

  strategy: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

  # -- override the container entrypoint
  command: []

  # -- override the container command arguments
  args: []

  # -- additional labels to be placed on the deployment
  additionalLabels: {}

  # -- default port for the application
  port: 8080

  probe:
    # -- Special port for probes, defaults to application.port if not set
    port: ~
    path: /api/_health
    startup:
      enabled: true
      # -- path for startup probes, defaults to application.probe.path if not set
      path: ~
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 60
      failureThreshold: 12
    readiness:
      enabled: true
      # -- path for readiness probes, defaults to application.probe.path if not set
      path: ~
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    liveness:
      enabled: true
      # -- path for liveness probes, defaults to application.probe.path if not set
      path: ~
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3



automountServiceAccountToken: false

securityContext:
  pod: {}
  container: {}

resources: {}

clusterip:
  enabled: false
  port: 8080
  protocol: TCP
  labels: {}

ingress:
  enabled: false
  ingressClassName: "nginx"
  host: ~
  tls: []
  labels: {}
  annotations: {}

route:
  enabled: false
  annotations: {}
  labels: {}
  hostnames: []
  parentRefs: []

persistence:
  enabled: false
  # -- use an existing PVC instead of creating a new one
  existingClaim: ~
  storageClassName: ~
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /data
  annotations: {}

labels: {}
env: []
volumeMounts: []
volumes: []
initContainers: []

serviceMonitor:
  enabled: false
  # -- additional labels to add to the ServiceMonitor (e.g. for Prometheus operator label selectors)
  labels: {}
  # -- separate port for metrics (e.g. 9090); when set, a "metrics" named port is added to the Service
  # and the ServiceMonitor references it automatically — leave unset to scrape the main "http" port
  metricsPort: ~
  # -- named port on the Service to scrape; auto-resolved to "metrics" when metricsPort is set
  port: http
  # -- metrics path
  path: /metrics
  # -- scrape interval
  interval: 30s
  # -- scrape timeout (defaults to Prometheus global if unset)
  scrapeTimeout: ~
  # -- http or https
  scheme: ~
  # -- TLS config for https scraping
  tlsConfig: {}
  # -- relabeling rules
  relabelings: []

# -- inline ConfigMaps to create and mount into the container
# Each entry creates a ConfigMap and mounts it at mountPath (defaults to /config/<name>)
# configMaps:
#   - name: myconfig
#     mountPath: /config/myconfig  # optional
#     data:
#       key1: value1
#       key2: value2
configMaps: []
